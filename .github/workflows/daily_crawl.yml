name: Daily ETF Crawl

on:
  schedule:
    - cron: "0 7 * * 1-5"  # 매주 월~금 07:00 UTC (한국시간 16:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl ETF constituents
        run: python crawl_etf.py

      - name: Compute scores
        run: python -c "from score_etf import main; main()"

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update ETF data $(date -u +%Y-%m-%d)"
          git push
